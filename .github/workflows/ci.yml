name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Manuscripts stay out of the repository. .gitignore says so, and an ignore
  # rule is advisory: `git add -f` overrides it, and a file already tracked when
  # the rule was written stays tracked. This job is the part that cannot be
  # overridden by accident. It matters for two reasons. A double-anonymous
  # submission cannot leak through a file that does not exist, and the rule that
  # every quoted number comes from a committed artifact only holds while the
  # manuscript is not itself an artifact.
  no-manuscripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: paper/ holds no tracked files
        run: |
          n=$(git ls-files paper/ | wc -l)
          if [ "$n" -ne 0 ]; then
            echo "$n tracked file(s) under paper/:"
            git ls-files paper/
            exit 1
          fi
          echo "paper/ is clean"
      - name: An sdist would not ship paper/
        run: |
          pip install --quiet build
          mkdir -p paper/usenix && echo "canary" > paper/usenix/canary.tex
          python -m build --sdist --outdir /tmp/sdist >/dev/null
          if tar tzf /tmp/sdist/*.tar.gz | grep -q "paper/"; then
            echo "an sdist shipped paper/"
            tar tzf /tmp/sdist/*.tar.gz | grep "paper/"
            exit 1
          fi
          echo "sdist excludes paper/"

  # The vocabulary firewall runs first and on every commit. It needs no
  # dependencies and no build, so there is no excuse for it to be skipped.
  namecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Forbidden vocabulary in tracked files
        run: python bin/namecheck.py
      # Both event types, because a rule enforced on one path is not enforced.
      # This job ran only on pull_request, so every direct push to main went
      # unscanned, which is how a commit message carrying a banned term reached
      # the public history.
      - name: Forbidden vocabulary in commit messages (pull request)
        if: github.event_name == 'pull_request'
        run: python bin/namecheck.py --commits origin/${{ github.base_ref }}..HEAD
      - name: Forbidden vocabulary in commit messages (push)
        if: github.event_name == 'push'
        run: python bin/namecheck.py --commits ${{ github.event.before }}..HEAD

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.14 is what runs locally and what pyproject advertises, so it is
        # tested rather than assumed.
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: pytest

  # The controls gate the headline, so CI has to run them. It did not, which
  # meant "controls 8/8 green" was enforced by nothing outside a developer's
  # own terminal.
  controls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Controls
        run: python bin/selfcheck.py

  # A number does not exist until a committed script regenerates it from
  # committed data. This job runs regen and checks the headline gate; it does
  # NOT re-derive results from upstream, which would need network and the
  # vendored target trees.
  regen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Every quotable number, with its n
        run: python bin/regen.py
      # Accepting both 0 and 3 checked nothing: those are the only two codes the
      # command returns. What matters is that an UNMET precondition refuses, so
      # the gate is exercised directly by removing the controls and requiring 3.
      - name: The headline gate refuses when a precondition is unmet
        run: |
          set +e
          mv results/controls.jsonl /tmp/controls.jsonl
          python bin/regen.py --headline
          code=$?
          mv /tmp/controls.jsonl results/controls.jsonl
          set -e
          if [ "$code" -ne 3 ]; then
            echo "with controls absent, --headline exited $code, expected 3"
            exit 1
          fi
