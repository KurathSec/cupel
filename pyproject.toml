[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cupel"
dynamic = ["version"]
description = "A coverage meter over the ACVP validation path for FIPS 203 and 204, with partial FIPS 205 coverage"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = ["acvp", "fips-203", "fips-204", "fips-205", "ml-kem", "ml-dsa", "slh-dsa", "test-adequacy"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Security :: Cryptography",
]

# Deliberately empty. A reviewer must be able to install this with no compiled
# dependency and no lockfile resolution. Everything below is stdlib.
dependencies = []

[project.optional-dependencies]
# jsonschema was declared for a schema-validation layer that was never built.
dev = ["pytest>=8"]

[project.scripts]
cupel = "cupel.cli.main:main"

[tool.hatch.version]
path = "src/cupel/__about__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/cupel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# vendor/ holds cloned upstream trees with their own test suites. Collecting
# them would run someone else's tests and report the result as ours.
norecursedirs = ["vendor", ".git", "build", "dist"]

[tool.ruff]
line-length = 100
target-version = "py311"
